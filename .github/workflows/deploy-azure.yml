name: Deploy to Azure App Service

# Git Flow:
#   develop -> staging slot/app
#   main    -> production app
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'titan-api/titan-api.csproj'

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      #- name: Test
      #  run: dotnet test --configuration Release --no-build --verbosity normal
      #  continue-on-error: false

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ${{ github.workspace }}/publish

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Create EF Core migration bundle
        run: |
          if dotnet ef migrations list --project ${{ env.PROJECT_PATH }} --no-build >/dev/null 2>&1; then
            dotnet ef migrations bundle \
              --project ${{ env.PROJECT_PATH }} \
              --configuration Release \
              --self-contained \
              --target-runtime linux-x64 \
              --output ${{ github.workspace }}/migrate
          else
            echo "No EF Core DbContext/migrations found - skipping bundle."
          fi

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ github.workspace }}/publish

      - name: Upload migration bundle
        if: hashFiles('migrate') != ''
        uses: actions/upload-artifact@v4
        with:
          name: migrations
          path: ${{ github.workspace }}/migrate

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: publish

      - name: Download migration bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: migrations
          path: migrate

      - name: Run database migrations
        if: hashFiles('migrate/efbundle') != ''
        run: |
          chmod +x migrate/efbundle
          ./migrate/efbundle --connection "$CONNECTION_STRING"
        env:
          CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
